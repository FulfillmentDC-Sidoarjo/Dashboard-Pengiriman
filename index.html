  @keyframes kb{
    0%{opacity:0;transform:translate3d(var(--x0),var(--y0),0) scale(1.04)}
    8%{opacity:1}
    33%{opacity:1}
    41%{opacity:0;transform:translate3d(var(--x1),var(--y1),0) scale(1.2)}
    100%{opacity:0;transform:translate3d(var(--x0),var(--y0),0) scale(1.04)}}
  .bgfx b{position:absolute;inset:0;
    background:linear-gradient(120deg,rgba(8,22,50,.96),rgba(20,52,108,.9),rgba(11,40,72,.93),rgba(242,183,46,.07),rgba(8,22,50,.96));
    background-size:320% 320%;animation:flow 22s ease-in-out infinite}
  @keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .bgfx::after{content:"";position:absolute;width:60vmax;height:60vmax;left:-15vmax;top:-20vmax;pointer-events:none;
    background:radial-gradient(circle,rgba(242,183,46,.06),transparent 62%);animation:drift 28s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate3d(75vw,45vh,0)}}
  @media (prefers-reduced-motion:reduce){.bgfx i,.bgfx b,.bgfx::after{animation:none}.bgfx i:nth-child(1){opacity:1;transform:none}}

  /* sidebar + area isi */
  .shell{display:flex;min-height:100vh}
  .side{flex:none;width:236px;background:rgba(36,79,145,.94);border-right:1px solid rgba(255,255,255,.12);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:15}
  .sbb{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;border-bottom:1px solid rgba(255,255,255,.14);font-size:14px;font-weight:800;line-height:1.2;text-transform:lowercase}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--tx);background:transparent;border:0;border-radius:10px;padding:12px;cursor:pointer}
  .nv:hover{background:rgba(255,255,255,.08)}
  .nv.on{background:var(--acbg);color:var(--ac);box-shadow:inset 3px 0 0 var(--ac)}
  .nv:focus-visible{outline:2px solid var(--yel);outline-offset:-2px}
  .nv svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .main{flex:1;min-width:0}
  .app[hidden]{display:none}
  .app{max-width:1120px;margin:0 auto;padding:18px 20px 40px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:26px;height:26px;display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:none}
  .mark i{display:block;border-radius:5px}
  .mark i:nth-child(1){background:var(--teal)}
  .mark i:nth-child(2){background:var(--red)}
  .mark i:nth-child(3){background:var(--yel)}
  .mark i:nth-child(4){background:var(--steel)}
  .bar h1{font-size:17px;font-weight:800;letter-spacing:.4px;margin:0;line-height:1.2}
  .meta{color:var(--mut);font-size:12px}

  /* bar kontrol: tanggal, pencarian, semua tanggal */
  .ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  input{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:rgba(27,64,121,.7);color:var(--tx);color-scheme:dark}
  input::placeholder{color:var(--mut)}
  input:focus{outline:2px solid var(--yel);outline-offset:1px;border-color:var(--yel)}
  .dtw{position:relative;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;border:1px solid var(--line);border-radius:10px;background:rgba(27,64,121,.7);flex:0 0 auto}
  .dtw:focus-within{outline:2px solid var(--yel);outline-offset:1px;border-color:var(--yel)}
  .dtw>span{white-space:nowrap;font-size:12px;font-weight:600;color:var(--mut)}
  .dtb{display:flex;align-items:center;gap:8px;font:inherit;border:0;background:transparent;color:#fff;cursor:pointer;padding:9px 0}
  .dtb:focus-visible{outline:none}
  .dtb b{font-size:13px;font-weight:700;white-space:nowrap}
  .dtw.kosong .dtb b{color:var(--mut);font-weight:500}
  .dtb svg{width:16px;height:16px;flex:none;stroke:var(--yel);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* kalender pilihan tanggal */
  .cal{position:absolute;top:calc(100% + 8px);left:0;z-index:30;width:292px;background:var(--card);color:var(--ink);border-radius:14px;border-top:4px solid var(--yel);box-shadow:0 14px 34px rgba(0,0,0,.45);overflow:hidden}
  .cal[hidden]{display:none}
  .calh{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;padding:10px 12px}
  .calh b{font-size:13px;font-weight:700;text-transform:capitalize}
  .calh button{font:inherit;width:28px;height:28px;border-radius:8px;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;font-size:17px;line-height:1;padding:0}
  .calh button:hover,.calh button:focus-visible{background:var(--yel);color:#1B2A4A;outline:none}
  .calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:10px 10px 6px}
  .calg span{text-align:center;font-size:10px;font-weight:700;color:var(--ink2);padding:4px 0}

const hariIni = () => {
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
};
const labelTglH = t => '<em' + (t > hariIni() ? ' class="plan"' : '') + '>' + labelTgl(t) + '</em>';
const labelTgl = t => {
  const p = t.split('-');
  return (t > hariIni() ? 'PLAN PENGIRIMAN TANGGAL : ' : 'PENGIRIMAN TANGGAL : ') + p[2] + '/' + p[1] + '/' + p[0];
};
const pesan = t => '<div class="empty">' + t + '</div>';

// wilayah: dari d.wil[kode ship to], atau kolom ke-9 (indeks 8) pada baris
const NO_WIL = 'Tanpa wilayah';
const wilDari = r => String((WIL[r[1]] != null ? WIL[r[1]] : r[8]) || '').trim();

// ===== pembantu pencarian (dipakai menu PENCARIAN ORDER dan jendela detail) =====
const tokensOf = s => String(s || '').trim().toLowerCase().split(/[\s,;]+/).filter(Boolean).slice(0, 30);
let HLRE = null, DQ = null; // DQ: kata pencarian untuk jendela detail (null = pakai kotak cari menu 1)
const setHL = ts => {
  const p = ts.map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).sort((a, b) => b.length - a.length);
  HLRE = p.length ? new RegExp('(' + p.join('|') + ')', 'gi') : null;
};
const hl = v => {
  const s = String(v == null ? '' : v);
  if (!HLRE) return esc(s);
  return s.split(HLRE).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
};
const lev = (a, b) => {
  let p = []; for (let j = 0; j <= b.length; j++) p[j] = j;
  for (let i = 1; i <= a.length; i++) {
    const c = [i];
    for (let j = 1; j <= b.length; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    p = c;
  }
  return p[b.length];
};
const near = (w, t, d) => (Math.abs(w.length - t.length) <= d && lev(w, t) <= d) ||
  (w.length > t.length && lev(w.slice(0, t.length), t) <= d);

// warehouse = kode berawalan H atau nama berawalan WH, selebihnya store
const isWH = x => /^H/i.test(x.code) || /^WH\b/i.test(x.name);

const KOL = {code: 'Kode', name: 'Ship to', wil: 'Wilayah', date: 'Tanggal', n: 'Order', cbm: 'CBM'};
const fmtTgl = t => { if (!t) return '-'; const p = t.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
const urut = arr => arr.slice().sort((a, b) => {
  const va = a[sortKey], vb = b[sortKey];
  const c = (typeof va === 'number' && typeof vb === 'number') ? va - vb
    : String(va == null ? '' : va).localeCompare(String(vb == null ? '' : vb), 'id', {numeric: true});
  return sortDir === 'asc' ? c : -c;
});

// daftar ship to berbentuk tabel; kolom Tanggal hanya muncul saat mencari di semua tanggal
const tabel = (arr, semua, badge) => {
  const cols = ['code', 'name'].concat(HAS_WIL ? ['wil'] : [], semua ? ['date'] : [], ['n', 'cbm']);
  const mx = Math.max.apply(null, arr.map(x => x.cbm).concat(0.0001));
  const th = k => '<th tabindex="0" data-s="' + k + '" class="' + (k === 'n' || k === 'cbm' ? 'r' : k === 'wil' ? 'cw' : '') +
    '" aria-sort="' + (sortKey === k ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none') + '">' + KOL[k] +
    (sortKey === k ? '<span class="ar">' + (sortDir === 'asc' ? '▲' : '▼') + '</span>' : '') + '</th>';
  const td = (x, k) => {
    if (k === 'code') return '<td class="cd">' + esc(x.code) + (badge && isWH(x) ? '<span class="bw">WH</span>' : '') + '</td>';
    if (k === 'name') return '<td><div class="nm">' + esc(x.name) + '</div>' +
      (x.zone !== 'LK' && (x.d !== '*' || Object.keys(x.dates).length === 1) ? '<div class="tgl">' + labelTglH(x.date) + '</div>' : '') +
      (x.hit && x.hit.length ? '<div class="ord">Order: ' + x.hit.slice(0, 2).map(s => esc(s)).join(', ') + (x.hit.length > 2 ? ' +' + (x.hit.length - 2) : '') + '</div>' : '') + '</td>';
    if (k === 'wil') return '<td class="cw cd">' + esc(x.wil || '-') + '</td>';
    if (k === 'date') return '<td class="cd">' + (x.zone === 'LK' ? '-' : fmtTgl(x.date) + (x.d === '*' && Object.keys(x.dates).length > 1 ? '<span class="bw">' + Object.keys(x.dates).length + ' tgl</span>' : '')) + '</td>'; // zone LK: tanggal tidak ditampilkan
    if (k === 'n') return '<td class="r cn">' + fmt(x.n, 0) + '</td>';
    return '<td class="r cb"><span class="cbc"><span class="mbar"><i style="width:' + (x.cbm / mx * 100) + '%"></i></span><b>' + fmt(x.cbm, 2) + '</b></span></td>';
  };
  return '<div class="tw2"><table class="tbl"><thead><tr>' + cols.map(th).join('') + '</tr></thead><tbody>' +
    arr.map(x => '<tr class="k2" tabindex="0" data-d="' + esc(x.d) + '" data-c="' + esc(x.code) + '">' + cols.map(k => td(x, k)).join('') + '</tr>').join('') +
    '</tbody></table></div>';
};

function render() {
  const tgl = document.getElementById('tgl').value;
  document.getElementById('dtw').classList.toggle('kosong', !tgl);
  document.getElementById('dtTxt').textContent = tgl ? fmtTgl(tgl) : 'Pilih tanggal';
  const q = document.getElementById('cari').value.trim().toLowerCase();
  const out = document.getElementById('out');
  // semua tanggal: tanggal kosong, atau ada pencarian dan kotak "Cari di semua tanggal" dicentang
  const semua = !tgl || (!!q && document.getElementById('semua').checked);

  if (semua && !q) {
    document.getElementById('sShip').textContent = '-';
    document.getElementById('sOrd').textContent = '-';
    document.getElementById('sCbm').textContent = '-';
    document.getElementById('wil').innerHTML = '';
    document.getElementById('tabs').innerHTML = '';
    document.getElementById('ft').innerHTML = '';
    document.getElementById('sTgl').textContent = '';
    out.innerHTML = pesan(ROWS1.length ? 'Pilih tanggal keberangkatan, atau ketik ship to / nama toko untuk mencari di semua tanggal.'
      : (curBU ? 'Belum ada data pengiriman untuk ' + BU_NAME[curBU] + '.' : 'Belum ada data dengan TYPE yang ditampilkan. Cek kolom H di spreadsheet dan daftar TYPE_TAMPIL di Code.gs.'));
    return;
  }

  const map = {};
  ROWS1.forEach(r => {
    if (!semua && r[0] !== tgl) return;
    // semua tanggal: satu baris per ship to (semua tanggal digabung); satu tanggal: satu baris per ship to
    const k = semua ? r[1] : r[0] + '|' + r[1];
    const m = (map[k] = map[k] || {d: semua ? '*' : r[0], date: r[0], dates: {}, code: r[1], name: r[2], city: r[3], wil: wilDari(r), zone: '', exts: [], n: 0, cbm: 0});
    if (r[0] > m.date) m.date = r[0]; // tanggal terbaru
    m.dates[r[0]] = 1;
    m.n++; m.cbm += r[4]; if (!m.zone && r[12]) m.zone = String(r[12]).trim().toUpperCase(); if (r[5]) m.exts.push(String(r[5]));
  });
  let list = Object.values(map).filter(x =>
    !q || x.code.toLowerCase().includes(q) || x.name.toLowerCase().includes(q) ||
    x.exts.some(s => s.toLowerCase().includes(q)));
  list.sort((a, b) => semua ? (b.date.localeCompare(a.date) || b.cbm - a.cbm) : b.cbm - a.cbm);

  // order key yang cocok dengan pencarian, ditampilkan di kartu
  list.forEach(x => { x.hit = q ? x.exts.filter(s => s.toLowerCase().includes(q)) : []; });

  // ringkasan per wilayah (6 teratas), dihitung dari hasil tanggal/pencarian saat ini, sebelum disaring wilayah
  const wEl = document.getElementById('wil');
  if (!HAS_WIL) {
    wEl.innerHTML = '';
  } else {
    const wc = {};
    list.forEach(x => {
      const w = x.wil || NO_WIL;
      const a = (wc[w] = wc[w] || {ship: 0, n: 0, cbm: 0});
      a.ship++; a.n += x.n; a.cbm += x.cbm;
    });
    if (selWil && !(selWil in wc)) selWil = '';
    const wk = Object.keys(wc).sort((a, b) => ((a === NO_WIL) - (b === NO_WIL)) || wc[b].cbm - wc[a].cbm);
    const sisa = wk.length - WIL_TOP;
    let shown = showAllWil ? wk : wk.slice(0, WIL_TOP);
    if (selWil && !shown.includes(selWil)) shown = shown.concat(selWil);
    const warna = ['--teal', '--red', '--yel', '--steel'];
    const mxw = Math.max.apply(null, wk.map(w => wc[w].cbm).concat(0.0001));
    wEl.innerHTML = '<div class="wh2"><b>Wilayah</b><span>' +
      (selWil ? 'Menampilkan ' + esc(selWil) + ' · klik lagi untuk semua'
        : (showAllWil || sisa <= 0 ? 'Klik wilayah untuk menyaring ship to' : WIL_TOP + ' teratas berdasarkan CBM')) + '</span></div>' +
      '<div class="wgrid">' + shown.map((w, i) => {
        const a = wc[w];
        return '<button type="button" class="wk' + (w === selWil ? ' on' : '') + '" style="--c:var(' + warna[i % 4] + ')" data-w="' + esc(w) +
          '" aria-pressed="' + (w === selWil) + '" title="' + a.ship + ' ship to · ' + a.n + ' order · ' + fmt(a.cbm, 2) + ' CBM">' +
          '<span class="wn">' + esc(w) + '</span><span class="wv">' + fmt(a.cbm, 2) + '</span>' +
          '<span class="wb"><i style="width:' + (a.cbm / mxw * 100) + '%"></i></span>' +
          '<span class="wm">' + fmt(a.ship, 0) + ' ship to</span></button>';
      }).join('') +
      (sisa > 0 ? '<button type="button" class="wk more" data-more="1">' + (showAllWil ? 'Tutup' : '+' + sisa + ' lainnya') + '</button>' : '') + '</div>';
    if (selWil) list = list.filter(x => (x.wil || NO_WIL) === selWil);
  }

  Object.keys(CUR).forEach(k => delete CUR[k]);
  list.forEach(x => { CUR[x.d + '|' + x.code] = x; });

  const totOrd = list.reduce((s, x) => s + x.n, 0);
  const totCbm = list.reduce((s, x) => s + x.cbm, 0);
  document.getElementById('sShip').textContent = fmt(list.length, 0);
  document.getElementById('sOrd').textContent = fmt(totOrd, 0);
  document.getElementById('sCbm').textContent = fmt(totCbm, 2);
  document.getElementById('sTgl').textContent = semua ? 'Semua tanggal' : labelTgl(tgl);

  const tabsEl = document.getElementById('tabs'), ftEl = document.getElementById('ft');
  if (!list.length) {
    tabsEl.innerHTML = ''; ftEl.innerHTML = '';
    out.innerHTML = pesan(semua ? 'Ship to atau order key tidak ditemukan.' :
      (q ? 'Ship to atau order key tidak ditemukan pada tanggal ini. Centang "Cari di semua tanggal" untuk mencari di tanggal lain.'
         : 'Tidak ada pengiriman pada tanggal ini.'));
    return;
  }

  // tab Semua / Warehouse / Store
  const nW = list.filter(isWH).length;
  const cnt = {all: list.length, w: nW, s: list.length - nW};
  tabsEl.innerHTML = [['all', 'Semua'], ['w', 'Warehouse'], ['s', 'Store']].map(t =>
    '<button type="button" data-t="' + t[0] + '" class="' + (tab === t[0] ? 'on' : '') + '" aria-pressed="' + (tab === t[0]) + '">' +
    t[1] + '<small>' + fmt(cnt[t[0]], 0) + '</small></button>').join('') +
    '<span class="so">' + (sortKey ? 'Urut: ' + KOL[sortKey] + (sortDir === 'asc' ? ' naik' : ' turun')
      : (semua ? 'Urut: tanggal terbaru' : 'Urut: CBM terbesar')) + '</span>';

  // daftar ship to: 15 baris teratas, sisanya lewat tombol "Tampilkan semua"
  let vis = tab === 'w' ? list.filter(isWH) : tab === 's' ? list.filter(x => !isWH(x)) : list;
  if (sortKey) vis = urut(vis);
  // ada pencarian atau tanggal sudah dipilih: tampilkan semua hasil, tanpa batas 10
  const paksa = !!q || datePicked;
  const tampil = (showAllCards || paksa) ? vis : vis.slice(0, ROW_LIMIT);
  out.innerHTML = vis.length
    ? tabel(tampil, semua, tab === 'all')
    : pesan('Tidak ada ship to pada tab ini.');
  ftEl.innerHTML = vis.length
    ? 'Menampilkan ' + fmt(tampil.length, 0) + ' dari ' + fmt(vis.length, 0) + ' ship to' +
      (vis.length > ROW_LIMIT && !paksa ? '<button type="button" id="more">' + (showAllCards ? 'Tampilkan lebih sedikit' : 'Tampilkan semua') + '</button>' : '')
    : '';
}

// detail diambil dari data yang sudah dimuat, jadi tanpa menunggu server
function detailDari(date, code, src) {
  const L = (src || ROWS1).filter(r => (date === '*' || r[0] === date) && r[1] === code);
  if (L.length && L[0].length < 8) return {}; // Code.gs lama belum mengirim detail
  const s = v => String(v == null ? '' : v).trim();
  return {hasShip: L.length > 0 && L[0].length >= 12,
    details: L.map(r => ({dt: r[0], ext: r[5], status: r[6], fulfillment: r[7], cbm: r[4], address: r[16] || (code && code !== '-' ? ADDR[code] : ''),
      sd: s(r[9]), td: s(r[10]), ad: s(r[11])}))};
}

function bukaDetail(date, code) {
  const x = CUR[date + '|' + code];
  if (!x) return;
  const my = ++reqId;
  const tk = DQ !== null ? DQ : tokensOf(document.getElementById('cari').value);
  setHL(tk);
  const src = DQ !== null ? ROWS : ROWS1; // dibuka dari PENCARIAN ORDER = semua type
  const mt = v => tk.length > 0 && tk.some(t => String(v == null ? '' : v).toLowerCase().includes(t));
  const txh = v => (v == null || v === '' ? '-' : hl(v));
  const head = '<div class="mh"><div class="mhl"><div class="code">' + hl(x.code) + '</div>' +
    '<h3 id="mTitle">' + hl(x.name) + '</h3>' +
    (x.zone !== 'LK' ? '<div class="tg">' + (date === '*' ? fmt(Object.keys(x.dates).length, 0) + ' tanggal pengiriman' : labelTgl(x.date)) + '</div>' : '') + '</div></div>';
  mBody.innerHTML = head + '<div class="empty" style="margin-top:14px">Memuat detail order...</div>';
  modal.classList.add('on');
  document.body.style.overflow = 'hidden';

  Promise.resolve()
    .then(() => detailDari(date, code, src))
    .then(d => {
      if (my !== reqId) return;
      if (!Array.isArray(d.details)) {
        mBody.innerHTML = head + '<div class="empty" style="margin-top:14px">Detail order belum tersedia. Code.gs perlu diperbarui dulu.</div>';
        return;
      }
      const L = d.details;
      if (!L.length) {
        mBody.innerHTML = head + '<div class="empty" style="margin-top:14px">Tidak ada detail order.</div>';
        return;
      }
      const tot = L.reduce((s, o) => s + num(o.cbm), 0);
      const alamat = L[0].address ? '<div class="adr">' + hl(L[0].address) + '</div>' : '';
      const baris = (o, i) => '<tr class="o' + (mt(o.ext) || mt(o.status) || mt(o.fulfillment) ? ' hl' : '') + '"><td>' + (i + 1) + '</td><td>' +
        txh(o.ext) + '</td><td>' + txh(o.status) + '</td><td>' + pill(o.fulfillment) +
        '</td><td style="text-align:right">' + fmt(num(o.cbm), 2) + '</td></tr>';
      // kelompokkan per shipping detail + transport driver + assistant driver
      // ringkasan dulu: satu baris per (tanggal +) shipping detail + transport driver + assistant driver; order muncul setelah diklik
      const showDt = date === '*' && x.zone !== 'LK';
      const NC = showDt ? 7 : 6;
      let isi, nGrp = 0;
      const ot = LL => '<table class="ot"><thead><tr><th>#</th><th>External order key</th><th>Status WMS</th><th>Fulfillment</th>' +
        '<th style="text-align:right">CBM</th></tr></thead><tbody>' + LL.map((o, i) => baris(o, i)).join('') + '</tbody></table>';
      if (d.hasShip) {
        const G = {};
        L.forEach(o => {
          const k = [showDt ? o.dt : '', o.sd, o.td, o.ad].join('||');
          (G[k] = G[k] || {dt: o.dt, sd: o.sd, td: o.td, ad: o.ad, o: [], cbm: 0});
          G[k].o.push(o); G[k].cbm += num(o.cbm);
        });
        const gl = Object.values(G).sort((a, b) => (showDt ? b.dt.localeCompare(a.dt) : 0) ||
          (!a.sd - !b.sd) || a.sd.localeCompare(b.sd, 'id', {numeric: true}));
        nGrp = gl.length;
        isi = gl.map(g => {
          const buka = tk.length > 0 && g.o.some(o => mt(o.ext) || mt(o.status) || mt(o.fulfillment)); // order yang dicari langsung terbuka
          return '<tbody class="grp' + (buka ? ' open' : '') + '"><tr class="gr" tabindex="0" role="button" aria-expanded="' + buka + '">' +
            '<td class="cv" aria-hidden="true"><span>&#9656;</span></td>' +
            (showDt ? '<td class="cp">' + (g.dt > hariIni() ? '<small>PLAN</small> ' : '') + fmtTgl(g.dt) + '</td>' : '') +
            '<td class="cs">' + txh(g.sd) + '</td><td>' + txh(g.td) + '</td><td>' + txh(g.ad) + '</td>' +
            '<td class="r">' + fmt(g.o.length, 0) + ' order<br><span style="font-weight:700">' + fmt(g.cbm, 2) + ' CBM</span></td></tr>' +
            '<tr class="od"><td colspan="' + NC + '">' + ot(g.o) + '</td></tr></tbody>';
        }).join('');
      } else {
        isi = '<tbody>' + L.map((o, i) => baris(o, i)).join('') + '</tbody>';
      }
      const kepala = d.hasShip
        ? '<tr><th></th>' + (showDt ? '<th>Pengiriman tanggal</th>' : '') + '<th>Shipping detail</th><th>Transport driver</th><th>Assistant driver</th><th class="r">Total</th></tr>'
        : '<tr><th>#</th><th>External order key</th><th>Status WMS</th><th>Fulfillment</th><th style="text-align:right">CBM</th></tr>';
      mBody.innerHTML = head + alamat +
        '<div class="chips">' + (date === '*' ? '<span>' + fmt(Object.keys(x.dates).length, 0) + ' tanggal</span>' : '') + '<span>' + fmt(L.length, 0) + ' order</span><span>' + fmt(tot, 2) + ' CBM</span>' +
        (nGrp > 1 ? '<span>' + fmt(nGrp, 0) + ' kelompok</span>' : '') + '</div>' +
        (d.hasShip ? '<div class="adr">Klik salah satu baris untuk melihat daftar order.</div>' : '') + '<div class="tw"><table><thead>' + kepala + '</thead>' + isi + '</table></div>';
      const hl1 = mBody.querySelector('tr.hl');
      if (hl1) hl1.scrollIntoView({block: 'center'});
    })
    .catch(() => {
      if (my === reqId) mBody.innerHTML = head + '<div class="empty" style="margin-top:14px">Detail order belum bisa dimuat.</div>';
    });
}

const isoD = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function gambarCal() {
  if (dataN !== ROWS1.length) { dataSet = new Set(ROWS1.map(r => r[0])); dataN = ROWS1.length; }
  const sel = tglEl.value, today = hariIni();
  const first = new Date(cy, cm, 1), lead = (first.getDay() + 6) % 7, total = Math.ceil((lead + new Date(cy, cm + 1, 0).getDate()) / 7) * 7;
  let g = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(h => '<span>' + h + '</span>').join('');
  for (let i = 0; i < total; i++) {
    const dt = new Date(cy, cm, 1 - lead + i), v = isoD(dt);
    g += '<button type="button" data-v="' + v + '" class="' + [dt.getMonth() !== cm ? 'o' : '', v === today ? 't' : '', dataSet.has(v) ? 'd' : '', v === sel ? 's' : ''].join(' ').trim() +
      '" aria-pressed="' + (v === sel) + '">' + dt.getDate() + '</button>';
  }
  calEl.innerHTML = '<div class="calh"><button type="button" data-n="-1" aria-label="Bulan sebelumnya">&#8249;</button><b>' +
    first.toLocaleDateString('id-ID', {month: 'long', year: 'numeric'}) + '</b><button type="button" data-n="1" aria-label="Bulan berikutnya">&#8250;</button></div>' +
    '<div class="calg">' + g + '</div>' +
    '<div class="calf"><button type="button" data-a="hapus">Hapus</button><small><i></i>ada data pengiriman</small><button type="button" data-a="today">Hari ini</button></div>';

function buOf(r) {

  return BU_DEFAULT;
}

  tutup();

  document.getElementById('v3').hidden = v !== 'v3';

}

const out2 = document.getElementById('out2'), ft2 = document.getElementById('ft2');
let IDX = null, VOCAB = null, SUG = null, SGL = [], sgOn = -1;
let s2Key = '', s2Dir = 'desc', s2Limit = 100, R2 = [], TOK2 = [], FUZ2 = false;
const KOL2 = [['date', 'Tanggal'], ['ext', 'External order key'], ['name', 'Ship to'], ['kota', 'Kota'], ['status', 'Status WMS'], ['ful', 'Fulfillment'], ['cbm', 'CBM'], ['sd', 'Shipping detail'], ['drv', 'Driver']];
const val2 = (r, k) => k === 'date' ? r[0] : k === 'ext' ? r[5] : k === 'name' ? r[2] : k === 'kota' ? r[3] : k === 'status' ? r[6] : k === 'ful' ? r[7] : k === 'cbm' ? r[4] : k === 'sd' ? r[9] : (r[10] + ' ' + r[11]);

// dipanggil setelah data dimuat: indeks teks per baris + indeks saran
function siapOrder() {
  IDX = ROWS.map(r => [r[5], r[1], r[2], r[3], wilDari(r), r[16] || (r[1] && r[1] !== '-' ? ADDR[r[1]] : ''), r[6], r[7], r[9], r[10], r[11], r[13], r[14], r[15]].map(v => String(v == null ? '' : v)).join('\n').toLowerCase());
  const M = {ship: new Map(), order: new Map(), kota: new Map(), wil: new Map(), drv: new Map()};
  const add = (k, v, o) => { v = String(v == null ? '' : v).trim(); if (v && v.charAt(0) !== '#' && !M[k].has(v)) M[k].set(v, o); };
  ROWS.forEach(r => {
    add('ship', r[1], {s: r[2]});
    add('order', r[5], {s: r[2] + ' (' + r[1] + ')'});
    add('kota', r[3], {}); add('wil', wilDari(r), {});
    add('drv', r[9], {}); add('drv', r[10], {}); add('drv', r[11], {});
  });
  const mk = (k, tipe) => Array.from(M[k].entries()).map(e => ({tipe: tipe, v: e[0], l: k === 'ship' ? e[0] + ' · ' + (e[1].s || '') : e[0], s: k === 'ship' ? '' : (e[1].s || ''),
    k: (k === 'ship' ? e[0] + ' ' + (e[1].s || '') : e[0]).toLowerCase()}));
  SUG = [mk('ship', 'Ship to'), mk('order', 'Order'), mk('kota', 'Kota'), mk('wil', 'Wilayah'), mk('drv', 'Driver')];
  cari2();
}

// kata mirip (salah ketik) dari seluruh kosakata data; kata berangka tidak dicocokkan mirip
function mirip(t) {
  if (t.length < 4 || /\d/.test(t)) return [];
  if (!VOCAB) {
    const V = new Set();
    IDX.forEach(h => h.split(/[^a-z0-9]+/).forEach(w => { if (w.length >= 3 && !/\d/.test(w)) V.add(w); }));
    VOCAB = Array.from(V);
  }
  const d = t.length >= 8 ? 2 : 1, o = [];
  for (let i = 0; i < VOCAB.length && o.length < 12; i++) if (VOCAB[i] !== t && near(VOCAB[i], t, d)) o.push(VOCAB[i]);
  return o;
}

function cari2(tetap) {
  if (!tetap) s2Limit = 100;
  const q = q2El.value.trim().toLowerCase();
  const or = or2El.checked;
  const toks = Array.from(new Set(tokensOf(q))).slice(0, or ? 30 : 8);
  TOK2 = toks; FUZ2 = false; R2 = [];
  const nEl = document.getElementById('o2n'), sEl = document.getElementById('o2s'), cEl = document.getElementById('o2c'), iEl = document.getElementById('o2i');
  setHL(toks);
  document.getElementById('v2').classList.toggle('has', toks.length > 0);
  if (!IDX) { out2.innerHTML = pesan('Data belum dimuat.'); return; }
  if (!toks.length) {
    nEl.textContent = sEl.textContent = cEl.textContent = '-'; iEl.textContent = ''; ft2.innerHTML = '';
    out2.innerHTML = '';
    document.getElementById('sphT').textContent = 'Ketik sebagian order key, nama toko, kota, atau driver';
    return;
  }
  let idx = [];
  const okAll = (h, es) => or ? es.some(x => x.some(w => h.includes(w))) : es.every(x => x.some(w => h.includes(w)));
  const ex = toks.map(t => [t]);
  for (let i = 0; i < IDX.length; i++) if (okAll(IDX[i], ex)) idx.push(i);
  if (!idx.length) {
    const ex2 = toks.map(t => [t].concat(mirip(t)));
    for (let i = 0; i < IDX.length; i++) if (okAll(IDX[i], ex2)) idx.push(i);
    if (idx.length) { FUZ2 = true; setHL(Array.from(new Set([].concat.apply([], ex2)))); }
  }
  // skor: kecocokan order key / kode ship to dinilai lebih tinggi
  const sc = {};
  idx.forEach(i => {
    const r = ROWS[i], e = String(r[5]).toLowerCase(), c = String(r[1]).toLowerCase(), n = ' ' + String(r[2]).toLowerCase();
    let s = 0;
    toks.forEach(t => { s += e === t ? 8 : e.includes(t) ? 5 : c === t ? 5 : (c.startsWith(t) || n.includes(' ' + t)) ? 3 : IDX[i].includes(t) ? 1 : 0; });
    sc[i] = s;
  });
  idx.sort((a, b) => {
    if (s2Key) {
      const va = val2(ROWS[a], s2Key), vb = val2(ROWS[b], s2Key);
      const c = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va == null ? '' : va).localeCompare(String(vb == null ? '' : vb), 'id', {numeric: true});
      return s2Dir === 'asc' ? c : -c;
    }
    return (sc[b] - sc[a]) || String(ROWS[b][0]).localeCompare(String(ROWS[a][0])) || String(ROWS[a][5]).localeCompare(String(ROWS[b][5]));
  });
  R2 = idx;

  const ships = new Set(), dts = idx.map(i => ROWS[i][0]).sort();
  let cbm = 0;
  idx.forEach(i => { ships.add(ROWS[i][1]); cbm += num(ROWS[i][4]); });
  nEl.textContent = fmt(idx.length, 0); sEl.textContent = fmt(ships.size, 0); cEl.textContent = fmt(cbm, 2);
  iEl.textContent = idx.length ? (dts[0] === dts[dts.length - 1] ? fmtTgl(dts[0]) : fmtTgl(dts[0]) + ' - ' + fmtTgl(dts[dts.length - 1])) : '';
  if (!idx.length) {
    ft2.innerHTML = '';
    out2.innerHTML = pesan('Tidak ada order yang cocok dengan "' + esc(q2El.value.trim()) + '". Coba kata yang lebih pendek atau kurangi jumlah kata.');
    return;
  }
  gambar2();
}

const drvNama = v => { const t = String(v == null ? '' : v).trim(), i = t.indexOf(' - '); return i > -1 ? t.slice(i + 3) : t; };
const IC = {
  hash: '<path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/>',
  barcode: '<path d="M4 5v14M7 5v14M11 5v14M14 5v14M17 5v14M20 5v14"/>',
  store: '<path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/>',
  store2: '<path d="M3 9l1-5h16l1 5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 12v8h14v-8"/>',
  tag: '<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><path d="M7 7h.01"/>',
  pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  building: '<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
  truck: '<path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  box: '<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7l8.7 5 8.7-5M12 22V12"/>',
  check: '<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4L12 14l-3-3"/>',
  chev: '<path d="M9 6l6 6-6 6"/>'
};
const ico = n => '<svg viewBox="0 0 24 24" aria-hidden="true">' + IC[n] + '</svg>';
const kosong = v => { const t = String(v == null ? '' : v).trim(); return (!t || t.charAt(0) === '#') ? '' : t; };

function gambar2() {
  const lim = R2.slice(0, s2Limit);
  const tiket = i => {
    const r = ROWS[i], lk = String(r[12] || '').trim().toUpperCase() === 'LK';
    const tgl = lk ? '' : fmtTgl(r[0]) + (r[0] > hariIni() ? '<span class="bw">PLAN</span>' : '');
    const d = v => kosong(v) ? hl(v) : '-';
    return '<div class="tkw"><div class="tk" tabindex="0" role="button" data-r="' + i + '" aria-label="Klik detail order ' + esc(String(r[5])) + '">' +
      '<div class="tkm"><div class="tkh">' + pill(r[7]) + '<span class="wms">' + d(r[6]) + '</span><span class="tgl">' + tgl + '</span></div>' +
      '<div class="tkk">' + d(r[5]) + '</div>' +
      '<div class="tkr"><div><div class="lb">Dari</div><div class="vl">Gudang</div></div>' +
      '<div class="tkl"><i></i>' + ico('truck') + '<i></i></div>' +
      '<div class="tkto"><div class="kt">Ke · ' + hl(r[1]) + '</div><div class="vl">' + d(r[2]) + '</div><div class="kt">' + d(r[3]) + '</div></div></div></div>' +
      '<div class="tks"></div>' +
      '<div class="tkr2"><div class="in"><div class="lb">CBM</div><div class="cb">' + fmt(num(r[4]), 2) + '</div>' +
      '<div class="lb" style="margin-top:10px">Kendaraan</div><div class="vl">' + d(r[9]) + '</div>' +
      '<div class="lb" style="margin-top:8px">Driver</div><div class="vl">' + (kosong(r[10]) ? hl(drvNama(r[10])) : '-') + '</div></div>' +
      '<div class="go">' + ico('chev') + '<span>Klik detail</span></div></div></div></div>';
  };
  out2.innerHTML = lim.map(tiket).join('');
  ft2.innerHTML = (FUZ2 ? '<span class="note">Tidak ada yang persis sama. Menampilkan hasil yang mirip.</span>' : '') +
    'Menampilkan ' + fmt(lim.length, 0) + ' dari ' + fmt(R2.length, 0) + ' order' +
    (R2.length > lim.length ? '<button type="button" id="more2">Tampilkan ' + fmt(Math.min(100, R2.length - lim.length), 0) + ' lagi</button>' : '');
}

// ===== detail order: kartu info berikon =====
const odEl = document.getElementById('od'), odX = document.getElementById('odX');
let odDari = null;
function bukaOrder(i) {
  const r = ROWS[i];
  if (!r) return;
  const ok = String(r[7]).trim().toUpperCase() === 'TERKIRIM', lk = String(r[12] || '').trim().toUpperCase() === 'LK';
  document.getElementById('odS').textContent = 'Detail order' + (lk ? '' : ' · ' + fmtTgl(r[0]));
  document.getElementById('odT').textContent = kosong(r[5]) || '-';
  const cls = ok ? 'ok' : 'wa';
  const hi = [[cls, 'check', 'Status WMS', kosong(r[6]), ''], [cls, 'truck', 'Fulfillment', kosong(r[7]), ''], ['bl', 'box', 'CBM', fmt(num(r[4]), 2), ' big']];
  document.getElementById('odHi').innerHTML = hi.map(h => '<div class="' + h[0] + '"><div class="lb">' + ico(h[1]) + h[2] + '</div><div class="v' + h[4] + '">' + (esc(h[3]) || '-') + '</div></div>').join('');
  const C = [
    ['hash', 'Order key', kosong(r[13])], ['barcode', 'External order key', kosong(r[5])],
    ['store', 'Ship to', kosong(r[1])], ['tag', 'Type', kosong(r[14])],
    ['store2', 'Name ship to', kosong(r[2]), 1], ['pin', 'Address', kosong(r[16] || (r[1] && r[1] !== '-' ? ADDR[r[1]] : '')), 1],
    ['building', 'City', kosong(r[3])], ['file', 'No LC', kosong(r[15])],
    ['truck', 'Shipping detail', kosong(r[9])], ['user', 'Transport driver', kosong(r[10])],
    ['users', 'Assistant driver', kosong(r[11])]
  ];
  document.getElementById('odGr').innerHTML = C.map(c => '<div class="odc' + (c[3] ? ' w' : '') + '"><div class="odi">' + ico(c[0]) + '</div><div><div class="k">' + c[1] +
    '</div><div class="v' + (c[2] ? '' : ' m') + '">' + (c[2] ? esc(c[2]) : '-') + '</div></div></div>').join('');
  odDari = document.activeElement;
  odEl.classList.add('on'); odEl.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  odEl.scrollTop = 0; odX.focus();
}
function tutupOrder() {
  if (!odEl.classList.contains('on')) return;
  odEl.classList.remove('on'); odEl.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  if (odDari && odDari.focus) odDari.focus();
}
odX.addEventListener('click', tutupOrder);
odEl.addEventListener('click', e => { if (e.target === odEl) tutupOrder(); });
odEl.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); odX.focus(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') tutupOrder(); });

// buka detail ship to (semua tanggal) dengan kata pencarian disorot
function detail2(code) {
  const rr = ROWS.filter(r => r[1] === code);
  if (!rr.length) return;
  const x = {d: '*', date: rr[0][0], dates: {}, code: code, name: rr[0][2], city: rr[0][3], wil: wilDari(rr[0]), zone: ''};
  rr.forEach(r => { x.dates[r[0]] = 1; if (r[0] > x.date) x.date = r[0]; if (!x.zone && r[12]) x.zone = String(r[12]).trim().toUpperCase(); });
  CUR['*|' + code] = x;
  DQ = TOK2.slice();
  try { bukaDetail('*', code); } finally { DQ = null; }
}
const urut2 = th => {
  const k = th.dataset.s;
  if (s2Key === k) s2Dir = s2Dir === 'asc' ? 'desc' : 'asc';
  else { s2Key = k; s2Dir = (k === 'cbm' || k === 'date') ? 'desc' : 'asc'; }
  setHL(TOK2); gambar2();
  const nh = out2.querySelector('th[data-s="' + k + '"]'); if (nh) nh.focus();
};
out2.addEventListener('click', e => {
  const b = e.target.closest('.tk');
  if (b) bukaOrder(+b.dataset.r);
});
out2.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const b = e.target.closest('.tk');
  if (b) { e.preventDefault(); bukaOrder(+b.dataset.r); }
});
ft2.addEventListener('click', e => {
  if (!e.target.closest('#more2')) return;
  s2Limit += 100; setHL(TOK2); gambar2();
  const nb = document.getElementById('more2'); if (nb) nb.focus();
});
or2El.addEventListener('change', () => cari2());

// saran otomatis
function sgTutup() { sg2El.hidden = true; sgOn = -1; q2El.setAttribute('aria-expanded', 'false'); q2El.removeAttribute('aria-activedescendant'); }
function sgTampil() {
  const ts = tokensOf(q2El.value), t = ts[ts.length - 1] || '';
  if (!SUG || t.length < 2) { sgTutup(); return; }
  SGL = [];
  SUG.forEach((arr, gi) => {
    const lim = gi === 0 ? 4 : 3, st = [], inc = [];
    for (let i = 0; i < arr.length && st.length < lim; i++) {
      const p = arr[i].k.indexOf(t);
      if (p === 0 || (p > 0 && /[\s.\-_|]/.test(arr[i].k.charAt(p - 1)))) st.push(arr[i]); else if (p > 0 && inc.length < lim) inc.push(arr[i]);
    }
    SGL = SGL.concat(st.concat(inc).slice(0, lim));
  });
  if (!SGL.length) sg2El.innerHTML = '<div class="sgn">Tidak ada saran. Tekan Enter atau lanjut mengetik untuk mencari.</div>';
  else {
    const prev = HLRE; setHL([t]);
    sg2El.innerHTML = SGL.map((s, i) => '<div class="sgi" role="option" id="sgo' + i + '" data-i="' + i + '" aria-selected="false"><span class="sgt">' + s.tipe + '</span><span class="sgl">' +
      hl(s.l) + '</span>' + (s.s ? '<span class="sgs">' + esc(s.s) + '</span>' : '') + '</div>').join('');
    HLRE = prev;
  }
  sgOn = -1; sg2El.hidden = false; q2El.setAttribute('aria-expanded', 'true');
}
function sgSorot(i) {
  const it = sg2El.querySelectorAll('.sgi');
  if (!it.length) return;
  sgOn = (i + it.length) % it.length;
  it.forEach((e, j) => { e.classList.toggle('on', j === sgOn); e.setAttribute('aria-selected', j === sgOn); });
  it[sgOn].scrollIntoView({block: 'nearest'});
  q2El.setAttribute('aria-activedescendant', 'sgo' + sgOn);
}
function sgPilih(i) {
  const s = SGL[i];
  if (!s) return;
  const ts = q2El.value.trim().split(/[\s,;]+/).filter(Boolean);
  if (ts.length <= 1) q2El.value = s.v; else { ts[ts.length - 1] = s.v; q2El.value = ts.join(' '); }
  sgTutup(); cari2(); q2El.focus();
}
let q2Timer = 0;
q2El.addEventListener('input', () => { sgTampil(); clearTimeout(q2Timer); q2Timer = setTimeout(() => cari2(), 150); });
q2El.addEventListener('focus', () => { if (q2El.value.trim()) sgTampil(); });
q2El.addEventListener('keydown', e => {
  if (sg2El.hidden) { if (e.key === 'ArrowDown' && q2El.value.trim()) sgTampil(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); sgSorot(sgOn + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); sgSorot(sgOn - 1); }
  else if (e.key === 'Enter') { if (sgOn >= 0) { e.preventDefault(); sgPilih(sgOn); } else { sgTutup(); clearTimeout(q2Timer); cari2(); } }
  else if (e.key === 'Escape') sgTutup();
});
sg2El.addEventListener('mousedown', e => e.preventDefault()); // fokus tetap di kotak cari
sg2El.addEventListener('click', e => { const it = e.target.closest('.sgi'); if (it) sgPilih(+it.dataset.i); });
document.addEventListener('click', e => { if (!sg2El.hidden && !document.getElementById('sw2').contains(e.target)) sgTutup(); });
window.siapOrder = siapOrder;
</script>
