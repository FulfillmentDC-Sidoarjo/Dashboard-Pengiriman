<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard pengiriman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2B5BA3;        /* biru utama */
    --side:#244F91;      /* biru lebih gelap untuk sidebar */
    --card:#F2F4F7;      /* abu terang untuk kotak */
    --ink:#1B4079;       /* teks navy di atas kotak terang */
    --ink2:#5F6B7D;      /* teks sekunder di atas kotak terang */
    --line:#6C95D1;
    --tx:#ffffff;
    --mut:#DCE6F5;
    --teal:#6FA89A;
    --red:#E8452E;
    --yel:#F2B72E;
    --steel:#5B87A8;
    --ac:#F2B72E;
    --acbg:rgba(242,183,46,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx)}
  .wrap{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
  aside{background:var(--side);padding:22px 16px}
  .brand{display:flex;align-items:center;gap:10px;margin:0 0 22px}
  .mark{width:26px;height:26px;display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:none}
  .mark i{display:block;border-radius:5px}
  .mark i:nth-child(1){background:var(--teal)}
  .mark i:nth-child(2){background:var(--red)}
  .mark i:nth-child(3){background:var(--yel)}
  .mark i:nth-child(4){background:var(--steel)}
  aside h1{font-size:17px;font-weight:800;letter-spacing:-.2px;margin:0;line-height:1.2;text-transform:lowercase}
  label{display:block;font-size:12px;font-weight:500;color:var(--mut);margin:14px 0 4px}
  input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx);color-scheme:dark}
  input::placeholder{color:var(--mut)}
  input:focus{outline:2px solid var(--yel);outline-offset:1px;border-color:var(--yel)}
  nav{margin-top:22px}
  nav div{padding:9px 12px;border-radius:10px;color:var(--mut)}
  nav div.on{background:var(--acbg);color:var(--yel);font-weight:700}
  main{padding:26px}
  .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .top h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
  .meta{color:var(--mut);font-size:12px}
  .sum{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .sum div{color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 16px;min-width:140px}
  .sum div:nth-child(1){border-top:4px solid var(--teal)}
  .sum div:nth-child(2){border-top:4px solid var(--red)}
  .sum div:nth-child(3){border-top:4px solid var(--yel)}
  .sum small{display:block;color:var(--ink2);font-size:12px}
  .sum b{font-size:22px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  /* semua kartu: bingkai atas navy */
  .box{--c:#1B4079;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:14px}
  .box .code{font-size:12px;color:var(--ink2);letter-spacing:.3px}
  .box .nm{color:var(--ink);font-weight:700;margin:2px 0 10px;line-height:1.3;min-height:36px}
  .box .row{display:flex;justify-content:space-between;align-items:baseline;color:var(--ink2);font-size:12px}
  .box .row b{color:var(--ink);font-size:16px;font-weight:700}
  .box .tg{font-size:11px;color:var(--ink);font-weight:700;margin-top:10px}
  .bar{height:6px;background:rgba(27,64,121,.12);border-radius:3px;margin-top:10px}
  .bar i{display:block;height:6px;background:var(--c);border-radius:3px}
  .box{cursor:pointer;transition:transform .12s,box-shadow .12s}
  .box:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.22)}
  .box:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
  .modal{display:none;position:fixed;inset:0;background:rgba(10,25,55,.68);z-index:10;padding:24px;overflow:auto}
  .modal.on{display:block}
  .panel{position:relative;max-width:1100px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:14px;border-top:5px solid var(--ink);padding:20px}
  .x{position:absolute;top:10px;right:14px;border:0;background:none;font:inherit;font-size:28px;line-height:1;color:var(--ink);cursor:pointer}
  .mh .code{font-size:12px;color:var(--ink2);letter-spacing:.3px}
  .mh h3{margin:2px 40px 6px 0;font-size:20px;font-weight:800;color:var(--ink)}
  .mh .tg{font-size:11px;font-weight:700;color:var(--ink)}
  .adr{margin-top:8px;font-size:12px;color:var(--ink2)}
  .chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .chips span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:12px;color:var(--ink)}
  .tw{margin-top:14px;max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
  .tw table{border-collapse:collapse;width:100%;font-size:12px}
  .tw th{position:sticky;top:0;background:var(--ink);color:#fff;text-align:left;padding:8px 10px;font-weight:600;white-space:nowrap}
  .tw td{padding:7px 10px;border-top:1px solid #E3E8F0;white-space:nowrap;color:var(--ink)}
  .tw tr:nth-child(even) td{background:#F7F9FC}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;background:#FBE9B7;color:var(--ink);font-weight:600;font-size:11px}
  .pill.ok{background:#CFE5DE}
  .empty{padding:40px;text-align:center;color:var(--ink2);background:var(--card);border:1px dashed var(--line);border-radius:14px}
  @media(max-width:720px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <div class="brand">
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <h1>Dashboard pengiriman</h1>
    </div>
    <label for="tgl">Tanggal pengiriman</label>
    <input type="date" id="tgl">
    <label for="cari">Cari</label>
    <input type="search" id="cari" placeholder="Ship to atau nama toko">
    <nav><div class="on">Ship to</div></nav>
  </aside>
  <main>
    <div class="top">
      <h2 id="judul">Ship to</h2>
      <span class="meta" id="meta"></span>
    </div>
    <div class="sum">
      <div><small>Jumlah ship to</small><b id="sShip">-</b></div>
      <div><small>Jumlah order</small><b id="sOrd">-</b></div>
      <div><small>Total CBM</small><b id="sCbm">-</b></div>
    </div>
    <div id="out" class="grid"><div class="empty" style="grid-column:1/-1">Memuat data...</div></div>
  </main>
</div>
<div id="modal" class="modal" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="x" id="mClose" aria-label="Tutup">&times;</button>
    <div id="mBody"></div>
  </div>
</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwrAckizj_u62pHaYZJ1fvDNjpee-6qkGFSTvTRwEwMXRmOgJzyNGshP9Oi4zcYn6Ba/exec?token=dashboard-pengiriman-250403109876dd';
const fmt = (n, d) => n.toLocaleString('id-ID', {minimumFractionDigits: d, maximumFractionDigits: d});
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ROWS = [];
let ADDR = {}; // alamat per ship to
const CUR = {}; // kartu yang sedang tampil, kunci: tanggal|kode

fetch(API).then(r => r.json()).then(d => {
  if (d.error) throw new Error(d.error);
  ROWS = d.rows || [];
  ADDR = d.addr || {};
  const dates = ROWS.map(r => r[0]).sort();
  const tgl = document.getElementById('tgl');
  if (dates.length) {
    tgl.min = dates[0];
    tgl.max = dates[dates.length - 1];
    tgl.value = dates[dates.length - 1];
  }
  document.getElementById('meta').textContent = 'Data diperbarui ' +
    new Date(d.updated).toLocaleString('id-ID', {dateStyle: 'medium', timeStyle: 'short'});
  render();
}).catch(() => {
  document.getElementById('out').innerHTML = '<div class="empty" style="grid-column:1/-1">Data belum bisa dimuat.</div>';
});

const hariIni = () => {
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
};
const labelTgl = t => {
  const p = t.split('-');
  return (t > hariIni() ? 'PLAN PENGIRIMAN TANGGAL : ' : 'PENGIRIMAN TANGGAL : ') + p[2] + '/' + p[1] + '/' + p[0];
};
const pesan = t => '<div class="empty" style="grid-column:1/-1">' + t + '</div>';

function render() {
  const tgl = document.getElementById('tgl').value;
  const q = document.getElementById('cari').value.trim().toLowerCase();
  const out = document.getElementById('out');
  const semua = !!q || !tgl; // ada pencarian atau tanggal kosong = cari di semua tanggal
  document.getElementById('judul').textContent = q ? 'Ship to · semua tanggal' : 'Ship to';

  if (semua && !q) {
    document.getElementById('sShip').textContent = '-';
    document.getElementById('sOrd').textContent = '-';
    document.getElementById('sCbm').textContent = '-';
    out.innerHTML = pesan('Pilih tanggal pengiriman, atau ketik ship to / nama toko untuk mencari di semua tanggal.');
    return;
  }

  const map = {};
  ROWS.forEach(r => {
    if (!semua && r[0] !== tgl) return;
    const k = r[0] + '|' + r[1];
    (map[k] = map[k] || {date: r[0], code: r[1], name: r[2], city: r[3], n: 0, cbm: 0});
    map[k].n++; map[k].cbm += r[4];
  });
  let list = Object.values(map).filter(x =>
    !q || x.code.toLowerCase().includes(q) || x.name.toLowerCase().includes(q));
  list.sort((a, b) => semua ? (b.date.localeCompare(a.date) || b.cbm - a.cbm) : b.cbm - a.cbm);

  Object.keys(CUR).forEach(k => delete CUR[k]);
  list.forEach(x => { CUR[x.date + '|' + x.code] = x; });

  const totOrd = list.reduce((s, x) => s + x.n, 0);
  const totCbm = list.reduce((s, x) => s + x.cbm, 0);
  const max = list.reduce((m, x) => Math.max(m, x.cbm), 1);
  document.getElementById('sShip').textContent = fmt(list.length, 0);
  document.getElementById('sOrd').textContent = fmt(totOrd, 0);
  document.getElementById('sCbm').textContent = fmt(totCbm, 2);

  out.innerHTML = list.length ? list.map(x =>
    '<div class="box" tabindex="0" role="button" data-d="' + esc(x.date) + '" data-c="' + esc(x.code) + '"><div class="code">' + esc(x.code) + '</div>' +
    '<div class="nm">' + esc(x.name) + '</div>' +
    '<div class="row"><span>' + x.n + ' order</span><b>' + fmt(x.cbm, 2) + ' CBM</b></div>' +
    '<div class="bar"><i style="width:' + Math.max(3, x.cbm / max * 100) + '%"></i></div>' +
    '<div class="tg">' + labelTgl(x.date) + '</div></div>'
  ).join('') : pesan(semua ? 'Ship to tidak ditemukan.' : 'Tidak ada pengiriman pada tanggal ini.');
}
const num = v => typeof v === 'number' ? v : (parseFloat(String(v == null ? '' : v).replace(',', '.')) || 0);
const txt = v => esc(String(v == null || v === '' ? '-' : v));
const pill = v => {
  const t = String(v == null ? '' : v).trim();
  if (!t) return '-';
  return '<span class="pill' + (t.toUpperCase() === 'TERKIRIM' ? ' ok' : '') + '">' + esc(t) + '</span>';
};
const modal = document.getElementById('modal');
const mBody = document.getElementById('mBody');
let reqId = 0;

function tutup() {
  modal.classList.remove('on');
  document.body.style.overflow = '';
  reqId++;
}

// detail diambil dari data yang sudah dimuat, jadi tanpa menunggu server
function detailDari(date, code) {
  const L = ROWS.filter(r => r[0] === date && r[1] === code);
  if (L.length && L[0].length < 8) return {}; // Code.gs lama belum mengirim detail
  return {details: L.map(r => ({ext: r[5], status: r[6], fulfillment: r[7], cbm: r[4], address: ADDR[code]}))};
}

function bukaDetail(date, code) {
  const x = CUR[date + '|' + code];
  if (!x) return;
  const my = ++reqId;
  const head = '<div class="mh"><div class="code">' + esc(x.code) + '</div>' +
    '<h3 id="mTitle">' + esc(x.name) + '</h3>' +
    '<div class="tg">' + labelTgl(x.date) + '</div></div>';
  mBody.innerHTML = head + '<div class="empty" style="margin-top:14px">Memuat detail order...</div>';
  modal.classList.add('on');
  document.body.style.overflow = 'hidden';

  Promise.resolve()
    .then(() => detailDari(date, code))
    .then(d => {
      if (my !== reqId) return;
      if (d.error) throw new Error(d.error);
      if (!Array.isArray(d.details)) {
        mBody.innerHTML = head + '<div class="empty" style="margin-top:14px">Detail order belum tersedia. Code.gs perlu diperbarui dulu.</div>';
        return;
      }
      const L = d.details;
      if (!L.length) {
        mBody.innerHTML = head + '<div class="empty" style="margin-top:14px">Tidak ada detail order.</div>';
        return;
      }
      const tot = L.reduce((s, o) => s + num(o.cbm), 0);
      const alamat = L[0].address ? '<div class="adr">' + esc(String(L[0].address)) + '</div>' : '';
      mBody.innerHTML = head + alamat +
        '<div class="chips"><span>' + fmt(L.length, 0) + ' order</span><span>' + fmt(tot, 2) + ' CBM</span></div>' +
        '<div class="tw"><table><thead><tr><th>#</th><th>External order key</th><th>Status WMS</th><th>Fulfillment</th>' +
        '<th style="text-align:right">CBM</th></tr></thead><tbody>' +
        L.map((o, i) => '<tr><td>' + (i + 1) + '</td><td>' + txt(o.ext) + '</td><td>' + txt(o.status) + '</td><td>' + pill(o.fulfillment) +
          '</td><td style="text-align:right">' + fmt(num(o.cbm), 2) + '</td></tr>').join('') +
        '</tbody></table></div>';
    })
    .catch(() => {
      if (my === reqId) mBody.innerHTML = head + '<div class="empty" style="margin-top:14px">Detail order belum bisa dimuat.</div>';
    });
}

const out = document.getElementById('out');
out.addEventListener('click', e => {
  const b = e.target.closest('.box');
  if (b) bukaDetail(b.dataset.d, b.dataset.c);
});
out.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const b = e.target.closest('.box');
  if (b) { e.preventDefault(); bukaDetail(b.dataset.d, b.dataset.c); }
});
document.getElementById('mClose').addEventListener('click', tutup);
modal.addEventListener('click', e => { if (e.target === modal) tutup(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') tutup(); });

document.getElementById('tgl').addEventListener('change', render);
document.getElementById('cari').addEventListener('input', render);
</script>
</body>
</html>
