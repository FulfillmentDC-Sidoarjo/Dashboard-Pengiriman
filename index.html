<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard pengiriman</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e3e6eb;--tx:#1b1f27;--mut:#6b7280;--ac:#1f6feb;--acbg:#e8f0fe}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
  .wrap{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
  aside{background:var(--card);border-right:1px solid var(--line);padding:20px 16px}
  aside h1{font-size:16px;margin:0 0 20px}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 4px}
  input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  input:focus{outline:2px solid var(--acbg);border-color:var(--ac)}
  nav{margin-top:22px}
  nav div{padding:8px 10px;border-radius:8px;color:var(--mut)}
  nav div.on{background:var(--acbg);color:var(--ac);font-weight:600}
  main{padding:24px}
  .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .top h2{margin:0;font-size:18px}
  .meta{color:var(--mut);font-size:12px}
  .sum{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:130px}
  .sum small{display:block;color:var(--mut);font-size:12px}
  .sum b{font-size:20px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .box .code{font-size:12px;color:var(--mut);letter-spacing:.3px}
  .box .nm{font-weight:600;margin:2px 0 10px;line-height:1.3;min-height:36px}
  .box .row{display:flex;justify-content:space-between;align-items:baseline;color:var(--mut);font-size:12px}
  .box .row b{color:var(--tx);font-size:16px;font-weight:600}
  .bar{height:5px;background:#eef0f4;border-radius:3px;margin-top:10px}
  .bar i{display:block;height:5px;background:var(--ac);border-radius:3px}
  .empty{padding:40px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:12px}
  @media(max-width:720px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>Dashboard pengiriman</h1>
    <label for="tgl">Tanggal pengiriman</label>
    <input type="date" id="tgl">
    <label for="cari">Cari</label>
    <input type="search" id="cari" placeholder="Ship to atau nama toko">
    <nav><div class="on">Ship to</div></nav>
  </aside>
  <main>
    <div class="top">
      <h2 id="judul">Ship to</h2>
      <span class="meta" id="meta"></span>
    </div>
    <div class="sum">
      <div><small>Jumlah ship to</small><b id="sShip">-</b></div>
      <div><small>Jumlah order</small><b id="sOrd">-</b></div>
      <div><small>Total CBM</small><b id="sCbm">-</b></div>
    </div>
    <div id="out" class="grid"><div class="empty" style="grid-column:1/-1">Memuat data...</div></div>
  </main>
</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwrAckizj_u62pHaYZJ1fvDNjpee-6qkGFSTvTRwEwMXRmOgJzyNGshP9Oi4zcYn6Ba/exec?token=dashboard-pengiriman-250403109876dd';
const fmt = (n, d) => n.toLocaleString('id-ID', {minimumFractionDigits: d, maximumFractionDigits: d});
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ROWS = [];

fetch(API).then(r => r.json()).then(d => {
  if (d.error) throw new Error(d.error);
  ROWS = d.rows || [];
  const dates = ROWS.map(r => r[0]).sort();
  const tgl = document.getElementById('tgl');
  if (dates.length) {
    tgl.min = dates[0];
    tgl.max = dates[dates.length - 1];
    tgl.value = dates[dates.length - 1];
  }
  document.getElementById('meta').textContent = 'Data diperbarui ' +
    new Date(d.updated).toLocaleString('id-ID', {dateStyle: 'medium', timeStyle: 'short'});
  render();
}).catch(() => {
  document.getElementById('out').innerHTML = '<div class="empty" style="grid-column:1/-1">Data belum bisa dimuat.</div>';
});

function render() {
  const tgl = document.getElementById('tgl').value;
  const q = document.getElementById('cari').value.trim().toLowerCase();
  const map = {};
  ROWS.forEach(r => {
    if (r[0] !== tgl) return;
    const k = r[1];
    (map[k] = map[k] || {code: r[1], name: r[2], city: r[3], n: 0, cbm: 0});
    map[k].n++; map[k].cbm += r[4];
  });
  let list = Object.values(map).filter(x =>
    !q || x.code.toLowerCase().includes(q) || x.name.toLowerCase().includes(q));
  list.sort((a, b) => b.cbm - a.cbm);

  const totOrd = list.reduce((s, x) => s + x.n, 0);
  const totCbm = list.reduce((s, x) => s + x.cbm, 0);
  const max = list.length ? list[0].cbm : 1;
  document.getElementById('sShip').textContent = fmt(list.length, 0);
  document.getElementById('sOrd').textContent = fmt(totOrd, 0);
  document.getElementById('sCbm').textContent = fmt(totCbm, 2);

  document.getElementById('out').innerHTML = list.length ? list.map(x =>
    '<div class="box"><div class="code">' + esc(x.code) + '</div>' +
    '<div class="nm">' + esc(x.name) + '</div>' +
    '<div class="row"><span>' + x.n + ' order</span><b>' + fmt(x.cbm, 2) + ' CBM</b></div>' +
    '<div class="bar"><i style="width:' + Math.max(3, x.cbm / max * 100) + '%"></i></div></div>'
  ).join('') : '<div class="empty" style="grid-column:1/-1">Tidak ada pengiriman pada tanggal ini.</div>';
}
document.getElementById('tgl').addEventListener('change', render);
document.getElementById('cari').addEventListener('input', render);
</script>
</body>
</html>
